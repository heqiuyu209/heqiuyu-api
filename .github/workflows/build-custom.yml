name: Build Custom Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# GHCR tag ownership (do not overlap with docker-build.yml):
#   this workflow (push to main)     -> :edge          (rolling development image)
#   docker-build.yml (push a tag)    -> :<tag> and :latest
# `latest` is deliberately NOT published here, so a main push and a tag build
# can never race for the same tag.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:edge
          cache-from: type=gha
          cache-to: type=gha,mode=max

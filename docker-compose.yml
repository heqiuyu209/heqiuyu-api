# heqiuyu Docker Compose Configuration
# 
# Quick Start:
#   1. Create a .env file next to this file (it is git-ignored) and set:
#        POSTGRES_PASSWORD=<a strong password>
#        REDIS_PASSWORD=<a strong password>
#      See .env.example for a documented template.
#   2. docker-compose up -d
#   3. Access at http://localhost:3000
#
# Using MySQL instead of PostgreSQL:
#   1. Comment out the postgres service and the SQL_DSN entry below it
#   2. Uncomment the mysql service and the MySQL SQL_DSN entry
#   3. Uncomment mysql in the heqiuyu-api service's depends_on list
#   4. Uncomment mysql_data in the top-level volumes section
#
# ⚠️  IMPORTANT: No password is stored in this file. Both are read from the
#     environment (POSTGRES_PASSWORD / REDIS_PASSWORD), and Compose aborts with an
#     error if either is unset - so a weak default can never be deployed by accident.
#     Passwords set here previously are still present in git history: rotate them.

services:
  heqiuyu-api:
    image: ghcr.io/heqiuyu209/heqiuyu-api:latest
    container_name: heqiuyu-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - "SQL_DSN=postgresql://root:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/heqiuyu-api"
#      - SQL_DSN=root:123456@tcp(mysql:3306)/heqiuyu-api  # Point to the mysql service, uncomment if using MySQL
      - "REDIS_CONN_STRING=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379"
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true # 是否启用错误日志记录 (Whether to enable error log recording)
      - BATCH_UPDATE_ENABLED=true  # 是否启用批量更新 (Whether to enable batch update)
      - NODE_NAME=heqiuyu-api-node-1  # 节点名称，用于审计日志中标识节点身份；多节点/容器部署时建议设置 (Node name used in audit logs; recommended when running multiple instances or in containers)
#      - STREAMING_TIMEOUT=300  # 流模式无响应超时时间，单位秒，默认120秒，如果出现空补全可以尝试改为更大值 （Streaming timeout in seconds, default is 120s. Increase if experiencing empty completions）
#      - SESSION_SECRET=random_string  # 多机部署时设置，必须修改这个随机字符串！！ （multi-node deployment, set this to a random string!!!!!!!）
#      - SYNC_FREQUENCY=60  # Uncomment if regular database syncing is needed
#      - GOOGLE_ANALYTICS_ID=G-XXXXXXXXXX  # Google Analytics 的测量 ID (Google Analytics Measurement ID)
#      - UMAMI_WEBSITE_ID=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx  # Umami 网站 ID (Umami Website ID)
#      - UMAMI_SCRIPT_URL=https://analytics.umami.is/script.js  # Umami 脚本 URL，默认为官方地址 (Umami Script URL, defaults to official URL)

    depends_on:
      - redis
      - postgres
#      - mysql  # Uncomment if using MySQL
    networks:
      - heqiuyu-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    networks:
      - heqiuyu-api-network

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_DB: heqiuyu-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - heqiuyu-api-network
#    ports:
#      - "5432:5432"  # Uncomment if you need to access PostgreSQL from outside Docker

  # mysql:
  #   image: mysql:8.2
  #   container_name: mysql
  #   restart: always
  #   environment:
  #     MYSQL_ROOT_PASSWORD: 123456  # ⚠️ IMPORTANT: Change this password in production!
  #     MYSQL_DATABASE: heqiuyu-api
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   networks:
  #     - heqiuyu-api-network
  #   ports:
  #     - "3306:3306"  # Uncomment if you need to access MySQL from outside Docker

volumes:
  pg_data:
  # mysql_data:

networks:
  heqiuyu-api-network:
    driver: bridge

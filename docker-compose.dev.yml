# Frontend Development - Backend built from local source
#
# Required environment:
#   Create a .env file next to this file (it is git-ignored) and set your own
#   strong passwords. Compose aborts with an error if either is unset, so a weak
#   default password can never be deployed by accident:
#     POSTGRES_PASSWORD=<a strong password>
#     REDIS_PASSWORD=<a strong password>
#
# Usage:
#   1. docker compose -f docker-compose.dev.yml up -d
#   2. cd web/default && bun install && bun run dev
#      (classic UI instead: cd web/classic && bun install && bun run dev)
#   3. Open http://localhost:3001 (Rsbuild dev server, API auto-proxied to :3000)
#
# Rebuild backend after Go code changes:
#   docker compose -f docker-compose.dev.yml up -d --build heqiuyu-api
#
# Stop:
#   docker compose -f docker-compose.dev.yml down
#
# Reset data:
#   docker compose -f docker-compose.dev.yml down -v

services:
  heqiuyu-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: heqiuyu-api-dev:local
    container_name: heqiuyu-api-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - dev_data:/data
    environment:
      - "SQL_DSN=postgresql://root:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/heqiuyu-api"
      - "REDIS_CONN_STRING=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379"
      - TZ=Asia/Shanghai
      - BATCH_UPDATE_ENABLED=true
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - dev-network

  redis:
    image: redis:7.4-alpine
    container_name: heqiuyu-api-dev-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    networks:
      - dev-network

  postgres:
    image: postgres:15.14-alpine
    container_name: heqiuyu-api-dev-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_DB: heqiuyu-api
    volumes:
      - dev_pg_data:/var/lib/postgresql/data
    networks:
      - dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d heqiuyu-api"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  dev_data:
  dev_pg_data:

networks:
  dev-network:
    driver: bridge
